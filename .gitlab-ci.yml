image: golang:latest

variables:
  REPO_NAME: gitlab.com/rainbird-ai/sdk-go

stages:
  - test

unit:
  stage: test
  script:
  - go install github.com/jstemmer/go-junit-report@latest
  - go test -race -coverprofile=coverage.out -v ./... 2>&1 | tee >(go-junit-report > report.xml)
  - go tool cover -html=coverage.out -o coverage.html
  artifacts:
    paths:
    - coverage.html
    reports:
      junit: report.xml

lint:
  stage: test
  script:
  - go install honnef.co/go/tools/cmd/staticcheck@latest
  - staticcheck ./...

benchmark:
  stage: test
  script:
  - go test -test.run=XXX -bench=. -benchmem ./...
